{% extends "base.html" %}
{% block title %}Verify OTP{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Verify OTP</h2>
    <p class="text-muted">Enter the 6-digit code sent by {{ "email" if channel == "email" else "SMS" }}.</p>

    <form method="POST">
        <label class="form-label">One-time password</label>
        <input name="otp" class="form-control mb-3" inputmode="numeric"
               pattern="[0-9]{6}" maxlength="6" required autofocus>

        <label class="form-label">New password</label>
        <div class="password-field mb-3">
            <input name="password" type="password" class="form-control"
                   minlength="8" required>
            <button type="button" class="password-toggle" data-password-toggle
                    aria-label="Show password" aria-pressed="false">👁</button>
        </div>

        <button class="btn btn-primary w-100">Reset password</button>
    </form>
</div>
{% endblock %}
