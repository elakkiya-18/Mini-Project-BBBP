{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Reset your password 🔐</h2>
    <p class="text-muted">We will send a one-time code to your chosen recovery method.</p>

    <form method="POST">
        <label class="form-label">Username, email, or mobile number</label>
        <input name="identifier" class="form-control mb-3"
               value="{{ identifier or '' }}"
               placeholder="Example: deepsthiru4071@gmail.com" required autofocus>

        <fieldset class="mb-3">
            <legend class="form-label fs-6">Send OTP by</legend>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="channel"
                       value="email" id="recoveryEmail" checked>
                <label class="form-check-label" for="recoveryEmail">Email (Gmail)</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="channel"
                       value="sms" id="recoverySms">
                <label class="form-check-label" for="recoverySms">Mobile number (SMS)</label>
            </div>
        </fieldset>

        <button class="btn btn-primary w-100">Send OTP</button>
    </form>
</div>
{% endblock %}
